name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # ubuntu-latest já tem Docker disponível nativamente, então os testes
      # de integração (Testcontainers: Postgres + Redis) rodam sem
      # configuração extra — diferente da fricção que existe em alguns
      # setups de Docker Desktop no Windows.
      - name: Rodar testes (unitários + integração)
        working-directory: backend
        run: mvn -B test

      - name: Publicar relatórios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
