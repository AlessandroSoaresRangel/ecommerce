spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  # Em desenvolvimento aponta para o Mailpit (servidor SMTP fake com UI web
  # em http://localhost:8025) — não precisa de credenciais reais.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mudar-este-segredo-em-producao-precisa-ter-pelo-menos-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}       # 1 hora
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 dias

app:
  mail:
    from: ${MAIL_FROM:naoresponda@ecommerce.com}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/checkout/success?session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/checkout/cancel}
  currency: ${STRIPE_CURRENCY:brl}

shipping:
  melhor-envio:
    base-url: ${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
    token: ${MELHOR_ENVIO_TOKEN:token_sandbox_placeholder}
    from-cep: ${MELHOR_ENVIO_FROM_CEP:01310-100}
    user-agent: ${MELHOR_ENVIO_USER_AGENT:ecommerce-api (naoresponda@ecommerce.com)}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

logging:
  level:
    com.seuprojeto.ecommerce: DEBUG
    org.hibernate.SQL: DEBUG
